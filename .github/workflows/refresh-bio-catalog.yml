name: Refresh Sanremo stock daily and prices weekly

on:
  schedule:
    # 06:30 Moscow: after the BIO 05:30 snapshot. Prices refresh once per Moscow week.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger-timeweb-build:
    if: github.repository == 'biotempbio/Sanremo_Site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Trigger existing Timeweb autodeploy
        run: |
          git config user.name 'Sanremo catalog refresh'
          git config user.email 'actions@users.noreply.github.com'
          git commit --allow-empty -m "Refresh Sanremo commercial data $(date -u +%F)"
          git push origin HEAD:main
