name: Import SanremoFamily posts

on:
  schedule:
    # Monday 03:00 Moscow time (UTC+3).
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public-feed importer dependencies
        run: python -m pip install --disable-pip-version-check requests lxml Pillow
      - name: Fetch tagged public posts
        run: python scripts/import-sanremo-world.py weekly
      - name: Commit new posts and optimized media
        run: |
          git add data/world-posts.json public/photo/world public/video/world
          if git diff --cached --quiet; then
            echo "No new Sanremo posts"
            exit 0
          fi
          git -c user.name='sanremo-world-bot' -c user.email='sanremo-world-bot@users.noreply.github.com' commit -m 'Import weekly SanremoFamily posts'
          git push
